# The environment (conda deps + jax-fem) is baked into pdmp-ci, built from the
# Dockerfile in this repo. See the Dockerfile header for build instructions.
#
# There is no container registry on gitlab.tudelft.nl, so this image exists only
# in the runner host's local Docker daemon. The pdmp runner is configured with
# pull_policy = "if-not-present" so it uses that local copy instead of trying to
# fetch it. Rebuild the image on the host and bump the tag here when
# environment.yml changes.
image: pdmp-ci:2026-07

stages: [test]

test:
  stage: test
  script:
    - pytest --cov=pdmp
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
