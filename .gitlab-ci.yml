# Define the stages of the pipeline

stages:
  - setup
  - test

setup_env:
  stage: setup
  script:
    - conda --version
    - conda env list
    - |
      if [ -d "./conda_env" ]; then
        echo "Environment already exists."
        conda env update --prefix ./conda_env -f environment.yml --prune
      else
        echo "Cearing new environment."
        conda env create --prefix ./conda_env -f environment.yml
      fi
    - conda env list
  cache:
    key: conda
    paths:
      - conda_env
    policy: pull-push
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Define a job for running tests
pytest:
  stage: test
  cache:
    key: conda
    paths:
      - conda_env
    policy: pull
  script:
    - source activate ./conda_env
    - conda list
    - pytest --cov=pdmp  # Run tests with coverage reporting
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  dependencies:
    - setup_env
