# Define the stages of the pipeline

stages:
  - setup
  - test

setup_env:
  stage: setup
  script:
    - conda --version
    - conda env create -f environment.yml -y
    - source activate pdmp
    - python --version

# Define a job for running tests
pytest:
  stage: test
  before_script:
    - source activate pdmp # Activate the conda environment
  script:
#    - echo "Hello, world!"  # Print a message to the console
#    - conda list
    - pytest --cov=pdmp  # Run tests with coverage reporting
  dependencies:
    - setup_env
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
