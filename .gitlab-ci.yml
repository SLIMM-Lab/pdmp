# Define image
image: continuumio/miniconda3:25.1.1-2 # fixed tag, might need to be update at a later stage

before_script:
  - conda install -n base -c conda-forge mamba conda-libmamba-solver -y

# Define the stages of the pipeline
stages:
  - setup
  - test

setup_env:
  stage: setup
  script:
    - conda --version
    - conda env list
    - |
      if [ -d "./conda_env" ]; then
        echo "Environment already exists - updating ...";
        mamba env update --prefix ./conda_env -f environment.yml --prune;
      else
        echo "Creating new environment ...";
        mamba env create --prefix ./conda_env -f environment.yml;
      fi
    - conda env list
  cache:
    key: conda
    paths:
      - conda_env
    policy: pull-push
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Define a job for running tests
pytest:
  stage: test
  cache:
    key: conda
    paths:
      - conda_env
    policy: pull
  script:
    - source activate ./conda_env
    - conda list
    - pytest --cov=pdmp  # Run tests with coverage reporting
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  dependencies:
    - setup_env
