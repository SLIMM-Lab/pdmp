# Define the stages of the pipeline

stages:
  - setup
  - test

setup_env:
  stage: setup
  script:
    - conda --version
    - ls -la
    - conda env list
    - if [ -d "./conda_env" ]
      then
        echo "Environment already exists."
        conda env update --prefix ./conda_env -f environment.yml --prune
      else
        conda env create --prefix ./conda_env -f environment.yml
      fi
    - conda env list
    - echo "source activate ./conda_env" >> activate_env.sh
  cache:
    key: conda
    paths:
      - conda_env
    policy: pull-push
  artifacts:
    paths:
      - ./activate_env.sh
    expire_in: 1 day

# Define a job for running tests
pytest:
  stage: test
  cache:
    key: conda
    paths:
      - conda_env
    policy: pull
  before_script:
  script:
    - ls ./conda_env
    - source activate_env.sh
    - conda list
    - pytest --cov=pdmp  # Run tests with coverage reporting
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  dependencies:
    - setup_env
