image: condaforge/mambaforge:24.9.0-0   # mamba included

variables:
  MAMBA_NO_PROMPT: "1"                  # non-interactive solves

stages: [test]

test:
  stage: test
  script:
    - mamba env create -p /tmp/env -f environment.yml
    - mamba run -p /tmp/env pytest --cov=pdmp
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
