name: pdmp-jax
channels:
  - conda-forge
  - defaults
  - pytorch
dependencies:
  # jax-fem core dependencies
  - python=3.10
  - numpy==2.2.6
  - scipy==1.15.2
  - matplotlib==3.10.3

  # extra dependencies
  - seaborn
  - meshio==5.3.5
  - petsc4py==3.23.4
  - fenics==2019.1.0

  # pdmp dependencies
  - tqdm
  - pytest
  - pytest-cov
  - snakeviz
  - pytorch
  - gpytorch
  - arviz
  - yapf
  - pyyaml
  - typing-extensions

   # pip dependencies
  - pip
  - pip:
    # jax-fem
    #- "jax[cuda12_pip]"
    - jax
    - setuptools==80.9.0
    - wheel==0.45.1
    - gmsh==4.14.0
    - fenics-basix==0.9.0
    - pyfiglet==1.0.3

    # pdmp
    - geomloss
