# Example configuration for JaxFemModel with custom sensor setup
# This demonstrates how to configure sensors via YAML config

problem:
  distribution:
    model:
      # Model type
      type: 'jax_fem'

      # Domain dimensions
      d_x: 1.0
      d_y: 1.0
      d_z: 2.5

      # Mesh and material parameters
      h: 0.5              # mesh size
      ele_type: 'HEX8'    # element type
      nu: 0.3             # Poisson's ratio
      d_u: -0.1           # Dirichlet BC displacement

      # Parameter dimensions
      n_params: 2
      d_obs: 9  # Will be auto-computed from sensors if not specified

      # Sensor configuration
      # You can define multiple sensors and sensor groups
      sensors:
        # Single-point sensor
        - name: 'sensor_left'
          point: [0.0, 0.5, 1.25]  # [x, y, z] position

        # Another single-point sensor
        - name: 'sensor_right'
          point: [1.0, 0.5, 1.25]

        # Multi-point sensor (sensor group)
        # This creates a group of observation points
        - name: 'sensor_group_vertical'
          points:
            - [0.5, 0.0, 0.5]
            - [0.5, 0.0, 1.25]
            - [0.5, 0.0, 2.0]

        # Another sensor group
        - name: 'sensor_group_horizontal'
          points:
            - [0.0, 0.5, 1.25]
            - [0.5, 0.5, 1.25]
            - [1.0, 0.5, 1.25]

      # Sensor location function type
      # Defines which mesh boundary the sensors are placed on
      # Options: 'side_faces', 'top_surface', 'bottom'
      sensor_location_type: 'side_faces'

      # Optional: random field configuration (if using spatial variation)
      field:
        type: 'exponential_recovery'
        f_infinity: 1.0
        # ... other field parameters

