# Forward UQ config for the 2D RVE model.
#
# Input parameters: [rho, l_scale]
#   rho     - recovery ratio: E_matrix(r) = E_inf * (1 - (1-rho) * exp(-r/l_scale))
#             rho=1 → homogeneous matrix; rho<1 → reduced stiffness near the fiber interface
#   l_scale - characteristic recovery length scale (same units as L)
#
# Prior: MultivariateLogNormal so that both parameters stay positive.
#   The mean/cov below are for the underlying Normal (log-space).
#   Implied lognormal means: rho ~ 0.50, l_scale ~ 0.15
#
# Output quantities: avg_stress (4 components) + max_von_mises (1 scalar)

model:
  name: RVE
  # Single circular fiber at the centre of a unit-square RVE
  fibers:
    - [0.5, 0.5, 0.2]
  L: 1.0
  mesh_size: 0.04
  ele_type: TRI3
  # Material properties (fixed; only the matrix E field varies with params)
  E_inf: 30000.0      # Far-field matrix Young's modulus [MPa]
  E_fiber: 60000.0    # Fiber Young's modulus [MPa]
  nu_matrix: 0.2
  nu_fiber: 0.2
  # Macroscopic uniaxial strain in x
  eps_macro: [0.001, 0.0, 0.0]
  # Reuse the mesh from the existing RVE example
#  msh_file: examples/rve_2d/data_linear/msh/rve.msh
  # Requested output quantities
  quantities:
    - avg_stress
    - max_von_mises

distribution:
  name: MultivariateLogNormal
  # Log-space parameters (mean and cov of log(params))
  mean: [-0.693, -1.897]   # exp(-0.693)≈0.50, exp(-1.897)≈0.15
  cov: [[0.04, 0.0],
        [0.0,  0.09]]      # log-space std: 0.2 for rho, 0.3 for l_scale

forward_uq:
  n_samples: 500
  seed: 42

output:
  dir: results_rve
